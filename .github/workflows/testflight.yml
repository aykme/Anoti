# Archives the iOS app in Release and uploads it to TestFlight, by hand only. Apple's cloud
# certificate signs the export through the App Store Connect API key in the repository's secrets,
# so no certificate or profile is kept here. The version and the build number are the catalog's
# versionName and versionCode, unchanged.
name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

# One upload at a time. A third dispatch replaces the one still waiting.
concurrency: testflight

defaults:
  run:
    shell: bash

jobs:
  # A job's runner is picked before it checks out, so the catalog is read in a job of its own.
  runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.read.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the macOS runner from the catalog
        id: read
        run: |
          macos=$(sed -n 's/^macosRunner = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          [ -n "$macos" ]
          echo "macos=$macos" | tee -a "$GITHUB_OUTPUT"

  # The key's secrets reach only the steps that sign in, and each writes the key to a temporary
  # file of its own. GitHub masks secrets in the console alone, and this repository is public, so
  # no file the artifact keeps carries them.
  upload:
    needs: runner
    runs-on: ${{ needs.runner.outputs.macos }}
    timeout-minutes: 90
    env:
      LOG_DIR: ${{ github.workspace }}/build/testflight
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-toolchain

      - name: Read the app's identity
        run: |
          read_catalog() { sed -n "s/^$1 = \"\(.*\)\"/\1/p" gradle/libs.versions.toml; }
          read_setting() { sed -n "s/^$1 = //p" iosApp/Configuration/"$2"; }
          # The project leaves its own team empty, so the team comes from the catalog.
          team=$(read_catalog iosTeamId)
          version=$(read_catalog versionName)
          code=$(read_catalog versionCode)
          bundle=$(read_setting BUNDLE_ID Config.xcconfig)
          if [ -z "$team" ] || [ -z "$bundle" ] || [ -z "$version" ] || [ -z "$code" ]; then
            echo "Missing: team '$team', bundle '$bundle', version '$version', code '$code'"
            exit 1
          fi
          # The build takes the catalog's versions through the generated Version.xcconfig, which
          # must match it.
          target=$(read_catalog iosDeploymentTarget)
          built_version=$(read_setting MARKETING_VERSION Version.xcconfig)
          built_code=$(read_setting CURRENT_PROJECT_VERSION Version.xcconfig)
          built_target=$(read_setting IPHONEOS_DEPLOYMENT_TARGET Version.xcconfig)
          if [ "$built_version" != "$version" ] || [ "$built_code" != "$code" ] \
            || [ "$built_target" != "$target" ]; then
            echo "Version.xcconfig has $built_version ($built_code), iOS $built_target."
            echo "The catalog has $version ($code), iOS $target."
            echo "Run ./gradlew generateIosVersionXcconfig and commit the file."
            exit 1
          fi
          echo "TEAM_ID=$team" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$bundle" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "ARCHIVE=$RUNNER_TEMP/Anoti.xcarchive" >> "$GITHUB_ENV"
          echo "Team $team, bundle $bundle, version $version ($code)"
          mkdir -p "$LOG_DIR"

      # A refused key, or a build already uploaded, fails here in seconds with Apple's answer.
      - name: The key signs in to App Store Connect
        timeout-minutes: 5
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: bash .github/scripts/asc-key-check.sh

      - name: Install the catalog's XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          binary=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)
          dirname "$binary" >> "$GITHUB_PATH"

      # xcodebuild's own sign-in may refuse a key the API takes. A one-screen app shows it in a
      # minute or two, before the app's long archive.
      - name: xcodebuild signs in with the key
        timeout-minutes: 15
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: bash .github/scripts/testflight-probe.sh

      - uses: ./.github/actions/gradle-on-macos

      # The project generated from project.yml, as ios.yml builds it, not the committed one.
      - name: Generate the Xcode project
        working-directory: iosApp
        run: |
          xcodegen --version
          xcodegen generate

      # Built unsigned. Signing it would need a development certificate with its private key on the
      # runner; only the export signs through Apple's cloud certificate.
      - name: Archive the app, Release
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="$TEAM_ID" archive > "$LOG_DIR/archive.log" 2>&1 \
            || { tail -60 "$LOG_DIR/archive.log"; exit 1; }
          tail -5 "$LOG_DIR/archive.log"

      # An empty folder would pass a plain test for it.
      - name: The archived app carries the Compose resources
        run: |
          app="$ARCHIVE/Products/Applications/Anoti.app"
          [ -n "$(find "$app/compose-resources" -type f | head -1)" ]
          ls -R "$app/compose-resources" | sed -n '1,40p'

      - name: Export and upload to TestFlight
        id: export
        timeout-minutes: 30
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: bash .github/scripts/testflight-export.sh "$ARCHIVE" upload

      # The uploaded build's own dSYM, which no rebuild can recreate. It holds no secret.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        with:
          name: testflight-dsym
          path: ${{ env.ARCHIVE }}/dSYMs
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testflight-logs
          path: build/testflight
