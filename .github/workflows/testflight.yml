# Archives the iOS app in Release and uploads it to TestFlight, by hand only. Apple's cloud
# certificate signs the export through the App Store Connect API key in the repository's secrets,
# so no certificate or profile is kept here. The build number is the catalog's version code and
# this workflow's run number, unique per upload.
name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

# One upload at a time. A third dispatch replaces the one still waiting.
concurrency: testflight

defaults:
  run:
    shell: bash

jobs:
  # A job's runner is picked before it checks out, so the catalog is read in a job of its own.
  runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.read.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the macOS runner from the catalog
        id: read
        run: |
          macos=$(sed -n 's/^macosRunner = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          [ -n "$macos" ]
          echo "macos=$macos" | tee -a "$GITHUB_OUTPUT"

  upload:
    needs: runner
    runs-on: ${{ needs.runner.outputs.macos }}
    timeout-minutes: 90
    env:
      LOG_DIR: ${{ github.workspace }}/build/testflight
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-toolchain
      - uses: ./.github/actions/gradle-on-macos

      # The project generated from project.yml, as ios.yml builds it, not the committed one.
      - name: Install the catalog's XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          binary=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)
          dirname "$binary" >> "$GITHUB_PATH"
      - name: Generate the Xcode project
        working-directory: iosApp
        run: |
          xcodegen --version
          xcodegen generate

      - name: Read the app's identity
        run: |
          echo "ARCHIVE=$RUNNER_TEMP/Anoti.xcarchive" >> "$GITHUB_ENV"
          echo "KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
          # The project leaves its own team empty, so the team comes from the catalog.
          team=$(sed -n 's/^iosTeamId = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          read_setting() { sed -n "s/^$1 = //p" iosApp/Configuration/"$2"; }
          bundle=$(read_setting BUNDLE_ID Config.xcconfig)
          version=$(read_setting MARKETING_VERSION Version.xcconfig)
          code=$(read_setting CURRENT_PROJECT_VERSION Version.xcconfig)
          if [ -z "$team" ] || [ -z "$bundle" ] || [ -z "$version" ] || [ -z "$code" ]; then
            echo "Missing: team '$team', bundle '$bundle', version '$version', code '$code'"
            exit 1
          fi
          echo "TEAM_ID=$team" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$bundle" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$code.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Team $team, bundle $bundle, version $version ($code.$GITHUB_RUN_NUMBER)"
          mkdir -p "$LOG_DIR"

      # The key's IDs reach only the steps that sign in. A file in the artifact never carries them:
      # GitHub masks secrets in the console alone, and this repository is public.
      - name: Write the App Store Connect key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ] \
            || { echo "An APP_STORE_CONNECT_* secret is missing"; exit 1; }
          umask 077
          mkdir -p "$(dirname "$KEY_PATH")"
          # A key pasted on Windows may carry CR line ends.
          printf '%s\n' "$KEY_P8" | tr -d '\r' > "$KEY_PATH"

      # A refused key fails here in seconds with its reason. xcodebuild would report it only as
      # missing profiles, after the archive.
      - name: The key signs in to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bash .github/scripts/asc-key-check.sh "$KEY_PATH" "$KEY_ID" "$ISSUER_ID" "$BUNDLE_ID"

      # Built unsigned: xcodebuild takes an API key only to export.
      - name: Archive the app, Release
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive > "$LOG_DIR/archive.log" 2>&1 \
            || { tail -60 "$LOG_DIR/archive.log"; exit 1; }
          tail -5 "$LOG_DIR/archive.log"

      # The export reads the app's entitlements from its signature, so the app is signed ad hoc
      # with the identifier and team Xcode would give it. PlistBuddy takes the dotted key whole.
      - name: Sign the archive ad hoc
        run: |
          app="$ARCHIVE/Products/Applications/Anoti.app"
          entitlements="$RUNNER_TEMP/entitlements.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :application-identifier string $TEAM_ID.$BUNDLE_ID" \
            -c "Add :com.apple.developer.team-identifier string $TEAM_ID" "$entitlements"
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements "$entitlements" "$app"
          codesign --verify --deep --strict "$app"
          codesign --display --entitlements - "$app"

      # Its log names the key's IDs, so it stays out of the artifact. The console masks them.
      - name: Export and upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$options"
          plutil -insert method -string app-store-connect "$options"
          plutil -insert destination -string upload "$options"
          plutil -insert teamID -string "$TEAM_ID" "$options"
          plutil -insert signingStyle -string automatic "$options"
          plutil -insert uploadSymbols -bool YES "$options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$options"
          log="$RUNNER_TEMP/export.log"
          if xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" > "$log" 2>&1; then
            tail -20 "$log"
            exit 0
          fi
          tail -80 "$log"
          # The summary log only: the verbose one holds the requests.
          find "$TMPDIR" -name 'IDEDistribution.standard.log' -path '*.xcdistributionlogs/*' \
            -exec cat {} \; 2> /dev/null | tail -80
          exit 1

      - name: Remove the key
        if: always()
        run: rm -rf "$(dirname "$KEY_PATH")"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testflight-logs
          path: build/testflight
