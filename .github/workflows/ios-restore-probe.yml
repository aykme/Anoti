# TEMPORARY: repeats "UI tests, then the whole restore checks" on several runners.
name: iOS restore probe

on:
  push:
    branches: [ios-restore-case-flake]

defaults:
  run:
    shell: bash

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: macos-26
    timeout-minutes: 150
    env:
      MEDIA_DIR: ${{ github.workspace }}/build/ios-media
      RESULTS_DIR: ${{ github.workspace }}/build/ios-results
      PROBE_ITERATIONS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-toolchain
      - uses: ./.github/actions/gradle-on-macos
      - name: Boot the simulator
        run: |
          mkdir -p "$MEDIA_DIR" "$RESULTS_DIR"
          bash .github/scripts/ios-boot-simulator.sh
      - name: Build the app and its UI tests, Debug
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination "id=$SIM_UDID" -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build-for-testing > "$MEDIA_DIR/build-debug.log" 2>&1 \
            || { tail -40 "$MEDIA_DIR/build-debug.log"; exit 1; }
          products="$GITHUB_WORKSPACE/build/DerivedData/Build/Products"
          echo "XCTESTRUN=$(ls "$products"/*.xctestrun | head -1)" >> "$GITHUB_ENV"
          echo "APP_PATH=$products/Debug-iphonesimulator/Anoti.app" >> "$GITHUB_ENV"
      - name: Probe
        run: bash .github/scripts/ios-restore-probe.sh 2>&1 | tee "$MEDIA_DIR/probe.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-${{ matrix.shard }}
          path: |
            build/ios-media
            !build/ios-media/**/*.mp4
