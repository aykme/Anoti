# Builds and checks the iOS app on GitHub's macOS runner, on every push to develop and on any
# branch by hand. The Swift sources are linted on Linux beside it.
# A push builds the app and runs the Kotlin/Native tests and SwiftLint; it installs no app. A run
# by hand picks the rest through its inputs, which the plan job turns into flags. A run started
# with lint_only runs SwiftLint and nothing else. A run started with release builds the app in
# Release, checks its stripping, and runs no test; it overrides every other input. A run started
# with store_screenshots also takes the App Store screenshots.
name: iOS

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      setup_check:
        description: Prove the Java lookup of the Xcode build and that it needs no Android SDK
        type: boolean
        default: false
      lint_only:
        description: Run only the Swift lint, without the builds and the tests
        type: boolean
        default: false
      # The Kotlin/Native tests: every commonTest and iosTest, in the native-tests job.
      unit_tests:
        description: Run the Kotlin/Native tests
        type: boolean
        default: true
      # AnimeFavoritesUserFlowTest, on the devices and in the orientations named below.
      ui_flow:
        description: Run AnimeFavoritesUserFlowTest
        type: boolean
        default: false
      # The other tests that run the app on a simulator: OrientationUITests, InfoDialogUITests,
      # and the restore and theme checks, which need the iPhone.
      ios_tests:
        description: Run OrientationUITests, InfoDialogUITests and the restore checks
        type: boolean
        default: false
      # SwiftLint's own job, and its analyzer over the Debug build log.
      swiftlint:
        description: Run SwiftLint and its analyzer
        type: boolean
        default: true
      # Where the app's tests run. No iOS simulator folds, so there is no fold.
      device:
        description: Where the app's tests run
        type: choice
        options:
          - phone
          - tablet
          - all
        default: phone
      # The orientations AnimeFavoritesUserFlowTest walks. The iPhone never turns, so it runs the
      # flow only when portrait is among them.
      orientation:
        description: The orientations AnimeFavoritesUserFlowTest walks
        type: choice
        options:
          - portrait
          - landscape
          - all
        default: portrait
      # The iPads that run when the device takes in the tablet, each in a job of its own: the
      # iPad Air 11-inch, the iPad mini (the narrowest), the iPad Pro 13-inch (the widest).
      tablet_model:
        description: The iPads the tablet's tests run on
        type: choice
        options:
          - air
          - mini
          - pro
          - all
        default: air
      # The Dynamic Type size of every simulator the run boots: the system's default, the largest
      # outside the accessibility sizes, or the largest of all.
      text_size:
        description: The text size of the simulators
        type: choice
        options:
          - default
          - xxxl
          - ax5
        default: default
      # StoreScreenshotsTests on the iPhone 17 Pro and the iPad Pro 13-inch, a job each, whatever
      # the app tests' device says.
      store_screenshots:
        description: Take the App Store screenshots
        type: boolean
        default: false
      release:
        description: Build only the Release app and check its stripping, with no test
        type: boolean
        default: false

# An explicit bash adds pipe fail, so a step piping into tee still fails with the command.
defaults:
  run:
    shell: bash

jobs:
  # Turns the event and the inputs into the flags every other job reads, so a push and a run by
  # hand with every default do the same.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      unit_tests: ${{ steps.flags.outputs.unit_tests }}
      swiftlint: ${{ steps.flags.outputs.swiftlint }}
      phone_flow: ${{ steps.flags.outputs.phone_flow }}
      phone_ios_tests: ${{ steps.flags.outputs.phone_ios_tests }}
      tablet_flow: ${{ steps.flags.outputs.tablet_flow }}
      tablet_ios_tests: ${{ steps.flags.outputs.tablet_ios_tests }}
      orientations: ${{ steps.flags.outputs.orientations }}
      tablet_models: ${{ steps.flags.outputs.tablet_models }}
      content_size: ${{ steps.flags.outputs.content_size }}
      store_screenshots: ${{ steps.flags.outputs.store_screenshots }}
      store_devices: ${{ steps.flags.outputs.store_devices }}
      macos: ${{ steps.runner.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
      # A job's runner is picked before it checks out, so the catalog is read here.
      - name: Read the macOS runner from the catalog
        id: runner
        run: |
          macos=$(sed -n 's/^macosRunner = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          [ -n "$macos" ]
          echo "macos=$macos" | tee -a "$GITHUB_OUTPUT"
      - name: Turn the inputs into flags
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          UNIT_TESTS: ${{ inputs.unit_tests }}
          UI_FLOW: ${{ inputs.ui_flow }}
          IOS_TESTS: ${{ inputs.ios_tests }}
          SWIFTLINT: ${{ inputs.swiftlint }}
          DEVICE: ${{ inputs.device }}
          ORIENTATION: ${{ inputs.orientation }}
          TABLET_MODEL: ${{ inputs.tablet_model }}
          TEXT_SIZE: ${{ inputs.text_size }}
          STORE_SCREENSHOTS: ${{ inputs.store_screenshots }}
          LINT_ONLY: ${{ inputs.lint_only }}
          RELEASE: ${{ inputs.release }}
        run: bash .github/scripts/ios-ci-plan.sh

  swiftlint:
    needs: plan
    if: ${{ !inputs.release && (inputs.lint_only || needs.plan.outputs.swiftlint == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint the Swift sources
        run: bash iosApp/scripts/swiftlint.sh

  framework:
    needs: plan
    if: ${{ !inputs.lint_only && !inputs.release }}
    runs-on: ${{ needs.plan.outputs.macos }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-toolchain
      - uses: ./.github/actions/gradle-on-macos
      - name: Link the Shared framework
        run: >
          ./gradlew
          :core-kmp:di-app:linkDebugFrameworkIosSimulatorArm64
          :core-kmp:di-app:linkReleaseFrameworkIosSimulatorArm64
          :core-kmp:di-app:linkDebugFrameworkIosArm64
          :core-kmp:di-app:linkReleaseFrameworkIosArm64

  native-tests:
    needs: plan
    if: ${{ !inputs.lint_only && !inputs.release && needs.plan.outputs.unit_tests == 'true' }}
    runs-on: ${{ needs.plan.outputs.macos }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-toolchain
      - uses: ./.github/actions/gradle-on-macos
      - name: Run every Kotlin/Native test on the simulator
        # The tests run inside a simulator, which can fail on its own. A retry runs only the modules
        # whose tests failed, since the rest are up to date.
        run: |
          for try in 1 2 3; do
            ./gradlew iosSimulatorArm64Test --continue && exit 0
            echo "The Kotlin/Native tests failed on try $try"
          done
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-native-test-reports
          path: |
            **/build/reports/tests/iosSimulatorArm64Test/
            **/build/test-results/iosSimulatorArm64Test/

  project:
    needs: plan
    if: ${{ !inputs.lint_only || inputs.release }}
    runs-on: ${{ needs.plan.outputs.macos }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-toolchain
      - name: Install the catalog's XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          binary=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)
          dirname "$binary" >> "$GITHUB_PATH"
      - name: Generate the Xcode project
        working-directory: iosApp
        run: |
          xcodegen --version
          xcodegen generate
      - uses: actions/upload-artifact@v7
        with:
          name: xcodeproj
          path: iosApp/iosApp.xcodeproj

  drift:
    if: ${{ !inputs.release }}
    needs: project
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Replace the committed project with the generated one
        run: rm -rf iosApp/iosApp.xcodeproj
      - uses: actions/download-artifact@v8
        with:
          name: xcodeproj
          path: iosApp/iosApp.xcodeproj
      - name: The committed project matches project.yml
        run: |
          changes=$(git status --porcelain -- iosApp)
          if [ -n "$changes" ]; then
            echo "The committed Xcode project differs from what project.yml generates:"
            echo "$changes"
            git diff --stat -- iosApp
            exit 1
          fi

  app:
    if: ${{ !inputs.release }}
    needs: [project, plan]
    runs-on: ${{ needs.plan.outputs.macos }}
    timeout-minutes: 150
    env:
      MEDIA_DIR: ${{ github.workspace }}/build/ios-media
      RESULTS_DIR: ${{ github.workspace }}/build/ios-results
      PHONE_FLOW: ${{ needs.plan.outputs.phone_flow }}
      PHONE_IOS_TESTS: ${{ needs.plan.outputs.phone_ios_tests }}
      CONTENT_SIZE: ${{ needs.plan.outputs.content_size }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-toolchain
      - uses: ./.github/actions/gradle-on-macos
      - name: Use the generated project
        run: rm -rf iosApp/iosApp.xcodeproj
      - uses: actions/download-artifact@v8
        with:
          name: xcodeproj
          path: iosApp/iosApp.xcodeproj
      - name: Prepare the media folders
        run: mkdir -p "$MEDIA_DIR" "$RESULTS_DIR"

      - name: Boot the simulator
        if: ${{ env.PHONE_FLOW == 'true' || env.PHONE_IOS_TESTS == 'true' }}
        run: bash .github/scripts/ios-boot-simulator.sh

      # Built for any simulator, so a run with no iPhone test boots none.
      - name: Build the app and its UI tests, Debug
        id: build_debug
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee "$MEDIA_DIR/build-debug.log"
          products="$GITHUB_WORKSPACE/build/DerivedData/Build/Products"
          echo "XCTESTRUN=$(ls "$products"/*.xctestrun | head -1)" >> "$GITHUB_ENV"
          echo "APP_PATH=$products/Debug-iphonesimulator/Anoti.app" >> "$GITHUB_ENV"

      - name: The bundle carries the Compose resources
        run: |
          # An empty folder would pass a plain test for it.
          [ -n "$(find "$APP_PATH/compose-resources" -type f | head -1)" ]
          ls -R "$APP_PATH/compose-resources" | sed -n '1,40p'

      - name: The UI tests
        if: ${{ env.PHONE_FLOW == 'true' || env.PHONE_IOS_TESTS == 'true' }}
        run: |
          only=()
          if [ "$PHONE_FLOW" = true ]; then
            only+=(-only-testing:iosAppUITests/AnimeFavoritesUserFlowTest)
          fi
          if [ "$PHONE_IOS_TESTS" = true ]; then
            only+=(-only-testing:iosAppUITests/OrientationUITests
              -only-testing:iosAppUITests/InfoDialogUITests)
          fi
          xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force "$MEDIA_DIR/ui-tests.mp4" &
          recorder=$!
          sleep 2
          status=0
          # The UI tests reach the live backend, so a failed one gets up to three tries.
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$SIM_UDID" \
            "${only[@]}" \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath "$RESULTS_DIR/ui-tests.xcresult" \
            2>&1 | tee "$MEDIA_DIR/ui-tests.log" || status=$?
          kill -INT "$recorder" 2> /dev/null || true
          wait "$recorder" || true
          exit $status

      - name: The restore checks
        if: ${{ always() && env.PHONE_IOS_TESTS == 'true' }}
        run: bash .github/scripts/ios-restore-checks.sh 2>&1 | tee "$MEDIA_DIR/restore-checks.log"

      - name: Export the screenshots the tests kept
        if: always()
        run: |
          # A restore case keeps its bundles under its own folder and try, as its media.
          find "$RESULTS_DIR" -type d -name '*.xcresult' -prune | while read -r bundle; do
            name=${bundle#"$RESULTS_DIR"/}
            xcrun xcresulttool export attachments --path "$bundle" \
              --output-path "$MEDIA_DIR/attachments/${name%.xcresult}" || true
          done

      # The analyzer reads the Debug build's log, so it needs only that build to have succeeded.
      - name: Analyze the Swift sources
        if: >-
          ${{ !cancelled() && steps.build_debug.outcome == 'success'
          && needs.plan.outputs.swiftlint == 'true' }}
        run: bash iosApp/scripts/swiftlint.sh analyze "$MEDIA_DIR/build-debug.log"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-media
          path: build/ios-media

  # The app's tests on the iPads a run's tablet model names, one job each, whose wide window turns
  # the app. Only when a run's device asks for it.
  ipad:
    name: ipad ${{ matrix.tablet.slug }}
    if: >-
      ${{ !inputs.release && !inputs.lint_only
      && (needs.plan.outputs.tablet_flow == 'true'
      || needs.plan.outputs.tablet_ios_tests == 'true') }}
    needs: [project, plan]
    runs-on: ${{ needs.plan.outputs.macos }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tablet: ${{ fromJSON(needs.plan.outputs.tablet_models) }}
    env:
      MEDIA_DIR: ${{ github.workspace }}/build/ios-media-ipad
      RESULTS_DIR: ${{ github.workspace }}/build/ios-results-ipad
      SIM_DEVICE: ${{ matrix.tablet.device }}
      CONTENT_SIZE: ${{ needs.plan.outputs.content_size }}
      TABLET_FLOW: ${{ needs.plan.outputs.tablet_flow }}
      TABLET_IOS_TESTS: ${{ needs.plan.outputs.tablet_ios_tests }}
      ORIENTATIONS: ${{ needs.plan.outputs.orientations }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-toolchain
      - uses: ./.github/actions/gradle-on-macos
      - name: Use the generated project
        run: rm -rf iosApp/iosApp.xcodeproj
      - uses: actions/download-artifact@v8
        with:
          name: xcodeproj
          path: iosApp/iosApp.xcodeproj
      - name: Boot the simulator
        run: |
          mkdir -p "$MEDIA_DIR" "$RESULTS_DIR"
          bash .github/scripts/ios-boot-simulator.sh

      - name: Build the app and its UI tests, Debug
        id: build_debug
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination "id=$SIM_UDID" -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee "$MEDIA_DIR/build-debug.log"
          products="$GITHUB_WORKSPACE/build/DerivedData/Build/Products"
          echo "XCTESTRUN=$(ls "$products"/*.xctestrun | head -1)" >> "$GITHUB_ENV"

      - name: OrientationUITests and InfoDialogUITests
        if: ${{ env.TABLET_IOS_TESTS == 'true' }}
        run: |
          xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force \
            "$MEDIA_DIR/orientation-tests.mp4" &
          recorder=$!
          sleep 2
          status=0
          # The UI tests reach the live backend, so a failed one gets up to three tries.
          xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "id=$SIM_UDID" \
            -only-testing:iosAppUITests/OrientationUITests \
            -only-testing:iosAppUITests/InfoDialogUITests \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath "$RESULTS_DIR/orientation-tests.xcresult" \
            2>&1 | tee "$MEDIA_DIR/orientation-tests.log" || status=$?
          kill -INT "$recorder" 2> /dev/null || true
          wait "$recorder" || true
          exit $status

      # One pass per orientation, each with its own video, log and result bundle.
      - name: AnimeFavoritesUserFlowTest
        if: >-
          ${{ !cancelled() && steps.build_debug.outcome == 'success'
          && env.TABLET_FLOW == 'true' }}
        run: |
          status=0
          for orientation in $ORIENTATIONS; do
            xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force \
              "$MEDIA_DIR/ui-flow-$orientation.mp4" &
            recorder=$!
            sleep 2
            # The UI tests reach the live backend, so a failed one gets up to three tries.
            TEST_RUNNER_ANOTI_ORIENTATION=$orientation xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN" -destination "id=$SIM_UDID" \
              -only-testing:iosAppUITests/AnimeFavoritesUserFlowTest \
              -retry-tests-on-failure -test-iterations 3 \
              -resultBundlePath "$RESULTS_DIR/ui-flow-$orientation.xcresult" \
              2>&1 | tee "$MEDIA_DIR/ui-flow-$orientation.log" || status=$?
            kill -INT "$recorder" 2> /dev/null || true
            wait "$recorder" || true
          done
          exit $status

      - name: Export the screenshots the tests kept
        if: always()
        run: |
          find "$RESULTS_DIR" -type d -name '*.xcresult' -prune | while read -r bundle; do
            name=${bundle#"$RESULTS_DIR"/}
            xcrun xcresulttool export attachments --path "$bundle" \
              --output-path "$MEDIA_DIR/attachments/${name%.xcresult}" || true
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-media-ipad-${{ matrix.tablet.slug }}
          path: build/ios-media-ipad

  # The App Store screenshots, one job per device. Only when a run sets store_screenshots.
  store-screenshots:
    name: store screenshots ${{ matrix.device.slug }}
    if: >-
      ${{ !inputs.release && !inputs.lint_only
      && needs.plan.outputs.store_screenshots == 'true' }}
    needs: [project, plan]
    runs-on: ${{ needs.plan.outputs.macos }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.plan.outputs.store_devices) }}
    env:
      MEDIA_DIR: ${{ github.workspace }}/build/ios-store
      RESULTS_DIR: ${{ github.workspace }}/build/ios-store-results
      SIM_DEVICE: ${{ matrix.device.device }}
      # The minutes from the boot to the Notification Center shot, for the time zone below.
      NOTIFICATION_CENTER_DELAY_MINUTES: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-toolchain
      - uses: ./.github/actions/gradle-on-macos
      - name: Use the generated project
        run: rm -rf iosApp/iosApp.xcodeproj
      - uses: actions/download-artifact@v8
        with:
          name: xcodeproj
          path: iosApp/iosApp.xcodeproj

      # Built before the simulator boots, so the time zone below is picked close to the shots.
      - name: Build the app and its UI tests, Debug
        run: |
          mkdir -p "$MEDIA_DIR" "$RESULTS_DIR"
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee "$MEDIA_DIR/build-debug.log"
          products="$GITHUB_WORKSPACE/build/DerivedData/Build/Products"
          echo "XCTESTRUN=$(ls "$products"/*.xctestrun | head -1)" >> "$GITHUB_ENV"

      # Notification Center's large clock shows the local time, so the runner takes the whole-hour
      # zone where the expected moment of that shot falls in the 10 o'clock hour. An Etc zone
      # inverts the sign: Etc/GMT-3 is three hours ahead of UTC.
      - name: Set the time zone
        run: |
          target=$(( $(date -u +%s) + NOTIFICATION_CENTER_DELAY_MINUTES * 60 ))
          offset=$(( 10 - 10#$(date -u -r "$target" +%H) ))
          if [ "$offset" -lt -12 ]; then offset=$(( offset + 24 )); fi
          if [ "$offset" -gt 14 ]; then offset=$(( offset - 24 )); fi
          if [ "$offset" -gt 0 ]; then
            zone="Etc/GMT-$offset"
          elif [ "$offset" -lt 0 ]; then
            zone="Etc/GMT+$(( -offset ))"
          else
            zone="Etc/GMT"
          fi
          sudo ln -sf "/usr/share/zoneinfo/$zone" /etc/localtime
          echo "Time zone $zone, local time $(date)"

      - name: Boot the simulator
        run: bash .github/scripts/ios-boot-simulator.sh

      - name: Dress the simulator
        run: |
          xcrun simctl ui "$SIM_UDID" appearance dark
          xcrun simctl status_bar "$SIM_UDID" override --time 10:00 --batteryState charged \
            --batteryLevel 100 --wifiBars 3 --cellularMode active --cellularBars 4 \
            || echo "The status bar override failed"
          xcrun simctl status_bar "$SIM_UDID" list || true
          echo "Simulator time: $(xcrun simctl spawn "$SIM_UDID" date)"

      # A failed try leaves favorites and notifications behind, so each try starts from a fresh
      # installation: the uninstall removes both, and the test run installs the app again. A
      # skipped test also ends well, so only the log's passed line counts.
      - name: The store screenshots
        run: |
          passed="Test Case '-\[iosAppUITests\.StoreScreenshotsTests "
          passed+="test(IPhone|IPad)Screenshots\]' passed"
          status=1
          for try in 1 2 3; do
            xcrun simctl uninstall "$SIM_UDID" com.alekseivinogradov.anoti || true
            xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force \
              "$MEDIA_DIR/store-try-$try.mp4" &
            recorder=$!
            sleep 2
            TEST_RUNNER_ANOTI_STORE_SCREENSHOTS=1 xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN" -destination "id=$SIM_UDID" \
              -only-testing:iosAppUITests/StoreScreenshotsTests \
              -resultBundlePath "$RESULTS_DIR/store-try-$try.xcresult" \
              2>&1 | tee "$MEDIA_DIR/store-try-$try.log" || true
            kill -INT "$recorder" 2> /dev/null || true
            wait "$recorder" || true
            if grep -qE "$passed" "$MEDIA_DIR/store-try-$try.log"; then
              echo "$try" > "$MEDIA_DIR/store-passed-try"
              status=0
              break
            fi
            echo "The store screenshots failed on try $try"
          done
          exit $status

      - name: Export the screenshots the tests kept
        if: always()
        run: |
          find "$RESULTS_DIR" -type d -name '*.xcresult' -prune | while read -r bundle; do
            name=$(basename "$bundle" .xcresult)
            xcrun xcresulttool export attachments --path "$bundle" \
              --output-path "$MEDIA_DIR/attachments/$name" || true
          done

      - name: Collect the store screenshots
        if: always()
        run: bash .github/scripts/ios-store-screenshots.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-store-screenshots-${{ matrix.device.slug }}
          path: build/ios-store

  # The app built in Release, stripped as an archive is, and checked. By hand only; no test runs.
  release-build:
    if: ${{ inputs.release }}
    needs: [project, plan]
    runs-on: ${{ needs.plan.outputs.macos }}
    timeout-minutes: 90
    env:
      MEDIA_DIR: ${{ github.workspace }}/build/ios-release
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-toolchain
      - uses: ./.github/actions/gradle-on-macos
      - name: Use the generated project
        run: rm -rf iosApp/iosApp.xcodeproj
      - uses: actions/download-artifact@v8
        with:
          name: xcodeproj
          path: iosApp/iosApp.xcodeproj

      - name: Build the app, Release
        id: build
        run: |
          mkdir -p "$MEDIA_DIR"
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build > "$MEDIA_DIR/build-release.log" 2>&1 \
            || { tail -40 "$MEDIA_DIR/build-release.log"; exit 1; }
          tail -5 "$MEDIA_DIR/build-release.log"
          products="$GITHUB_WORKSPACE/build/DerivedData/Build/Products"
          echo "APP_PATH=$products/Release-iphonesimulator/Anoti.app" >> "$GITHUB_ENV"

      - name: The release check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          RELEASE_CHECK_ENFORCE: "1"
        run: bash .github/scripts/ios-release-check.sh

      # The app's own dSYM; the wildcard keeps the bundle's folder in the artifact.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: ios-dsym
          path: build/DerivedData/Build/Products/Release-iphonesimulator/Anoti*.dSYM
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-release
          path: build/ios-release

  setup-check:
    if: ${{ inputs.setup_check && !inputs.release }}
    needs: [project, plan]
    runs-on: ${{ needs.plan.outputs.macos }}
    timeout-minutes: 150
    env:
      LOG_DIR: ${{ github.workspace }}/build/setup-check
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-toolchain
      # No setup-java here: it would set JAVA_HOME and spoil pass 1.
      - uses: ./.github/actions/gradle-memory
      - name: Use the generated project
        run: rm -rf iosApp/iosApp.xcodeproj
      - uses: actions/download-artifact@v8
        with:
          name: xcodeproj
          path: iosApp/iosApp.xcodeproj
      - name: Install Android Studio
        run: |
          brew install --cask android-studio
          "/Applications/Android Studio.app/Contents/jbr/Contents/Home/bin/java" -version
      - name: Keep Gradle off the runner's own JDKs
        run: |
          mkdir -p "$LOG_DIR"
          echo "org.gradle.java.installations.auto-detect=false" >> ~/.gradle/gradle.properties
          sudo mv /Library/Java/JavaVirtualMachines /Library/Java/JavaVirtualMachines.hidden || true
      - name: Pass 1, Java from Android Studio
        run: |
          env -u JAVA_HOME xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd1 CODE_SIGNING_ALLOWED=NO build > "$LOG_DIR/pass1.log" 2>&1 \
            || { tail -40 "$LOG_DIR/pass1.log"; exit 1; }
          grep "Java from /Applications/Android Studio.app" "$LOG_DIR/pass1.log"
      - name: Pass 2, JDK 21 downloaded from JDK 17
        run: |
          "$JAVA_HOME_17_arm64/bin/java" -version
          rm -rf ~/.gradle/jdks build/dd1
          JAVA_HOME="$JAVA_HOME_17_arm64" ./gradlew --stop || true
          JAVA_HOME="$JAVA_HOME_17_arm64" xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd2 CODE_SIGNING_ALLOWED=NO build > "$LOG_DIR/pass2.log" 2>&1 \
            || { tail -40 "$LOG_DIR/pass2.log"; exit 1; }
          ls ~/.gradle/jdks | tee -a "$LOG_DIR/pass2.log" | grep 21
      - name: Pass 3, the SDK in its default folder
        run: |
          test ! -f local.properties
          JAVA_HOME="$JAVA_HOME_17_arm64" ./gradlew --stop || true
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT JAVA_HOME="$JAVA_HOME_17_arm64" xcodebuild \
            -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd3 \
            CODE_SIGNING_ALLOWED=NO build > "$LOG_DIR/pass3.log" 2>&1 \
            || { tail -40 "$LOG_DIR/pass3.log"; exit 1; }
          grep "Android SDK from $HOME/Library/Android/sdk" "$LOG_DIR/pass3.log"
      - name: Pass 4, no SDK anywhere, the outcome recorded
        run: |
          JAVA_HOME="$JAVA_HOME_17_arm64" ./gradlew --stop || true
          mv ~/Library/Android/sdk ~/Library/Android/sdk-hidden
          # Built from nothing, so no task is skipped as up to date and the outcome is real.
          find . -name build -type d -prune -not -path './build' -exec rm -rf {} +
          if env -u ANDROID_HOME -u ANDROID_SDK_ROOT JAVA_HOME="$JAVA_HOME_17_arm64" xcodebuild \
            -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd4 \
            CODE_SIGNING_ALLOWED=NO build > "$LOG_DIR/pass4.log" 2>&1; then
            echo "pass 4: the build succeeded without an Android SDK" | tee -a "$LOG_DIR/pass4.log"
          else
            grep -iE "sdk location|ANDROID_HOME|sdk.dir" "$LOG_DIR/pass4.log" | sed -n '1,5p'
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-setup-check-logs
          path: build/setup-check
