# The Gradle daemon runs on JDK 21. A machine without one downloads it from these links.
# They are Adoptium's links to the latest JDK 21 release, so they never go stale. The links
# updateDaemonJvm writes name one foojay build, and foojay deletes it once a newer one ships.
# Rerunning that task writes such links back. Restore these afterward.
toolchainUrl.FREE_BSD.AARCH64=https\://api.adoptium.net/v3/binary/latest/21/ga/linux/aarch64/jdk/hotspot/normal/eclipse
