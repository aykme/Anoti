[versions]
#Suppressed: App versions — all used via libs.versions.<name>.get() in build.gradle.kts,
#Studio's unused-entry inspection just doesn't recognize that accessor pattern
#noinspection GradleDependency,UnusedVersionCatalogEntry
compileSdk = "36"
#noinspection UnusedVersionCatalogEntry
jvmTarget = "17"
#noinspection UnusedVersionCatalogEntry
minSdk = "26"
#noinspection OldTargetApi,UnusedVersionCatalogEntry
targetSdk = "36"
#noinspection UnusedVersionCatalogEntry
versionCode = "9"
#noinspection UnusedVersionCatalogEntry
versionName = "1.09"

#Library versions
activity = "1.13.0"
agp = "9.3.1"
annotationJvm = "1.10.0"
appcompat = "1.8.0"
composeMaterial3 = "1.9.0"
composeMultiplatform = "1.11.1"
constraintlayout = "2.2.2"
coroutines = "1.11.0"
decompose = "3.5.0"
detekt = "1.23.8"
espressoContrib = "3.7.0"
espressoCore = "3.7.0"
essenty = "2.5.0"
junitKtx = "1.3.0"
kotlin = "2.4.10"
kotlinInject = "0.9.0"
kotlinxDatetime = "0.8.0"
kotlinxSerialization = "1.11.0"
ksp = "2.3.11"
ktor = "3.5.2"
material = "1.14.0"
mockk = "1.14.11"
mviKotlin = "4.4.0"
playServicesAppset = "16.1.0"
recyclerview = "1.4.0"
robolectric = "4.16.1"
room = "2.8.4"
rules = "1.7.0"
sqlite = "2.7.0"
swiperefreshlayout = "1.2.0"
workRuntimeKtx = "2.11.2"

# 1.19.0 requires compileSdk 37 (AGP requirement already satisfied since 9.1) —
# 1.18.0 is the max compatible with the current compileSdk 36.
#noinspection GradleDependency
coreKtx = "1.18.0"
# 5.0.9 requires compileSdk 37 — 5.0.7 is the max compatible with the
# current compileSdk 36.
#noinspection NewerVersionAvailable
glide = "5.0.7"
# okhttp-android 5.5.0 requires compileSdk 37 — 5.4.0 is the max compatible
# with the current compileSdk 36.
#noinspection NewerVersionAvailable
okhttpBom = "5.4.0"

[libraries]
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-annotation-jvm = { group = "androidx.annotation", name = "annotation-jvm", version.ref = "annotationJvm" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
