[versions]
#Suppressed: App versions — all used via libs.versions.<name>.get() in build.gradle.kts,
#Studio's unused-entry inspection just doesn't recognize that accessor pattern
#noinspection GradleDependency,UnusedVersionCatalogEntry
compileSdk = "36"
#noinspection UnusedVersionCatalogEntry
jvmTarget = "17"
#noinspection UnusedVersionCatalogEntry
minSdk = "26"
#noinspection OldTargetApi,UnusedVersionCatalogEntry
targetSdk = "36"
#noinspection UnusedVersionCatalogEntry
versionCode = "9"
#noinspection UnusedVersionCatalogEntry
versionName = "1.09"

#Library versions
activity = "1.13.0"
agp = "9.3.1"
annotationJvm = "1.10.0"
appcompat = "1.7.1"
constraintlayout = "2.2.2"
coroutines = "1.11.0"
dagger = "2.60.1"
espressoContrib = "3.7.0"
espressoCore = "3.7.0"
essenty = "2.5.0"
junitKtx = "1.3.0"
kotlin = "2.4.10"
ksp = "2.3.11"
material = "1.14.0"
mockk = "1.14.11"
moshiKotlin = "1.15.2"
mviKotlin = "4.4.0"
navigationKtx = "2.9.8"
okhttpBom = "5.4.0"
recyclerview = "1.4.0"
retrofit = "3.0.0"
room = "2.8.4"
rules = "1.7.0"
swiperefreshlayout = "1.2.0"
workRuntimeKtx = "2.11.2"

# 1.19.0 requires compileSdk 37 (AGP requirement already satisfied since 9.1) —
# 1.18.0 is the max compatible with the current compileSdk 36.
#noinspection GradleDependency
coreKtx = "1.18.0"
# 5.0.9 requires compileSdk 37 — 5.0.7 is the max compatible with the
# current compileSdk 36.
#noinspection GradleDependency
glide = "5.0.7"

[libraries]
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-annotation-jvm = { group = "androidx.annotation", name = "annotation-jvm", version.ref = "annotationJvm" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-espresso-contrib = { group = "androidx.test.espresso", name = "espresso-contrib", version.ref = "espressoContrib" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-junit-ktx = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "junitKtx" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigationKtx" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigationKtx" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-rules = { group = "androidx.test", name = "rules", version.ref = "rules" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "workRuntimeKtx" }
converter-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
essenty-lifecycle = { group = "com.arkivanov.essenty", name = "lifecycle", version.ref = "essenty" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshiKotlin" }
mvikotlin = { group = "com.arkivanov.mvikotlin", name = "mvikotlin", version.ref = "mviKotlin" }
mvikotlin-extensions-coroutines = { group = "com.arkivanov.mvikotlin", name = "mvikotlin-extensions-coroutines", version.ref = "mviKotlin" }
mvikotlin-main = { group = "com.arkivanov.mvikotlin", name = "mvikotlin-main", version.ref = "mviKotlin" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttpBom" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

# Suppressed: not used anywhere yet, but plausibly useful later — kept on purpose instead of deleted.
#noinspection UnusedVersionCatalogEntry
essenty-instance-keeper = { group = "com.arkivanov.essenty", name = "instance-keeper", version.ref = "essenty" }
#noinspection UnusedVersionCatalogEntry
essenty-statekeeper = { group = "com.arkivanov.essenty", name = "state-keeper", version.ref = "essenty" }
#noinspection UnusedVersionCatalogEntry
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
#noinspection UnusedVersionCatalogEntry
mvikotlin-logger = { group = "com.arkivanov.mvikotlin", name = "mvikotlin-logging", version.ref = "mviKotlin" }
#noinspection UnusedVersionCatalogEntry
mvikotlin-timetravel = { group = "com.arkivanov.mvikotlin", name = "mvikotlin-timetravel", version.ref = "mviKotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
