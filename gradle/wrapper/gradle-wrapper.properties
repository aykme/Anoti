distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle is maxed within the AGP policy described next to agp in gradle/libs.versions.toml.
# It is the newest release that works with that AGP and with the oldest Studio it implies.
# Rerunning the wrapper task rewrites this file and drops these comments. Restore them afterward.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
