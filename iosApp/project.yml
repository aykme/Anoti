# The source the Xcode project is generated from: `xcodegen generate` in this folder. The CI
# workflow sets XCODE_VERSION and XCODEGEN_VERSION from gradle/libs.versions.toml.
name: iosApp

options:
  minimumXcodeGenVersion: ${XCODEGEN_VERSION}
  xcodeVersion: ${XCODE_VERSION}
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig

settings:
  base:
    # The Kotlin build phase writes outside the sandbox Xcode would put it in.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The project builds no Intel simulator slice, and Compose's resource task refuses one.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    SWIFT_VERSION: 5.0
    # XCUIApplication and XCUIElement belong to the main actor. Complete checking makes a call
    # from elsewhere a warning, and the next setting makes it an error.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: $(TEAM_ID)
    CODE_SIGN_STYLE: Automatic

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    preBuildScripts:
      - name: Compile Kotlin Framework
        script: /bin/sh "$SRCROOT/scripts/compile-kotlin-framework.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../core-kmp/di-app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
      configs:
        # Every Release build is post-processed as an archive is, so it is stripped. The other
        # three are the defaults, written out to pin them.
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          DEAD_CODE_STRIPPING: YES
    scheme:
      testTargets:
        - iosAppUITests

  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
